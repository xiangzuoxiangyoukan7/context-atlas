<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1800" viewBox="0 0 2300 1800">
<defs><style>
.title{font:700 30px "Microsoft YaHei";fill:#0f172a}.sub{font:400 16px "Microsoft YaHei";fill:#475569}.h{font:700 14px "Microsoft YaHei";fill:#0f172a}.t{font:400 12px "Microsoft YaHei";fill:#475569}.root{fill:#1e3a8a;stroke:#1e3a8a}.gate{fill:#dbeafe;stroke:#2563eb;stroke-width:2}.leaf{fill:#dcfce7;stroke:#16a34a;stroke-width:2}.archive{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.line{stroke:#94a3b8;stroke-width:2;fill:none}.guide{fill:#fff;stroke:#e2e8f0;stroke-width:2}
