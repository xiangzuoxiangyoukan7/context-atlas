<style>.title{font:700 30px "Microsoft YaHei";fill:#0f172a}.sub{font:400 16px "Microsoft YaHei";fill:#475569}.type{font:700 12px "Microsoft YaHei";fill:#475569}.h{font:700 16px "Microsoft YaHei";fill:#0f172a}.t{font:400 13px "Microsoft YaHei";fill:#475569}.edge{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.req{fill:#dbeafe;stroke:#60a5fa;stroke-width:2}.feature{fill:#dcfce7;stroke:#16a34a;stroke-width:4}.tech{fill:#ffedd5;stroke:#fb923c;stroke-width:2}.accept{fill:#f3e8ff;stroke:#a855f7;stroke-width:2}.evid{fill:#fce7f3;stroke:#ec4899;stroke-width:2}.dep{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.note{fill:#fff;stroke:#e2e8f0;stroke-width:2}</style>
