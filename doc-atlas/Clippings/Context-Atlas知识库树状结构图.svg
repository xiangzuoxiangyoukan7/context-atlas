<!-- 05 branch -->
<path d="M800,1330 H850 V1330 M850,1330 H900" class="line"/><g><rect x="900" y="1300" width="250" height="50" rx="8" class="leaf"/><text x="1025" y="1331" text-anchor="middle" class="t">AI协作规则.md</text><rect x="1170" y="1300" width="250" height="50" rx="8" class="leaf"/><text x="1295" y="1331" text-anchor="middle" class="t">AI知识采集协议.md</text><rect x="1440" y="1300" width="250" height="50" rx="8" class="leaf"/><text x="1565" y="1331" text-anchor="middle" class="t">文档元数据规范.md</text></g>

<!-- 90 branch -->
<path d="M800,1600 H900" class="line"/><rect x="900" y="1570" width="430" height="60" rx="8" class="archive"/><text x="1115" y="1607" text-anchor="middle" class="t">历史实施任务和原始设计材料叶子文件</text>

<rect x="50" y="1680" width="2000" height="75" rx="12" class="guide"/><text x="1050" y="1712" text-anchor="middle" class="h">蓝色 README = 主要约束和门禁；绿色 Markdown = 独立叶子知识；灰色 = 历史背景。父子连线只表达树状导航，需求—功能—技术—验收之间的水平关系见图状图。</text>
</svg>
