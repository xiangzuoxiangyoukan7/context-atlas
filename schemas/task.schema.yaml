schema: task.v1
types:
  product_task:
    required: [id, type, title, feature, status, acceptance, last_updated]
    id_pattern: TASK-Fxx-nnn
  governance_task:
    required: [id, type, title, plan, status, acceptance, last_updated]
    id_pattern: TASK-KB-nnn
enums:
  status: [draft, ready, in_progress, blocked, acceptance, completed]
rules:
  - acceptance must be non-empty and unique
  - completed requires all declared acceptance IDs to be passed with evidence and version

