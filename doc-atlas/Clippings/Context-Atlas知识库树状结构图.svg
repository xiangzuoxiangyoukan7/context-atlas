<path d="M800,150 H920 V120 M920,150 V180" class="line"/><g><rect x="920" y="95" width="250" height="50" rx="8" class="leaf"/><text x="1045" y="126" text-anchor="middle" class="t">项目概述.md</text><rect x="920" y="155" width="250" height="50" rx="8" class="leaf"/><text x="1045" y="186" text-anchor="middle" class="t">术语表.md</text></g>

