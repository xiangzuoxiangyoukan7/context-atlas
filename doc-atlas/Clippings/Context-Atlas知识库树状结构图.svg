<rect x="500" y="1000" width="300" height="60" rx="10" class="gate"/><text x="650" y="1037" text-anchor="middle" class="h">03-变更与证据/README.md</text>
<rect x="500" y="1300" width="300" height="60" rx="10" class="gate"/><text x="650" y="1337" text-anchor="middle" class="h">05-知识治理/README.md</text>
<rect x="500" y="1570" width="300" height="60" rx="10" class="gate"/><text x="650" y="1607" text-anchor="middle" class="h">90-历史归档/README.md</text>
</g>

