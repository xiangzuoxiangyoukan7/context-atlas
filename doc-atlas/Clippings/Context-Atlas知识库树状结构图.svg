<rect width="2300" height="1800" fill="#f8fafc"/>
<text x="50" y="52" class="title">Context Atlas 知识库树状结构</text>
<text x="50" y="82" class="sub">目录不是节点；README 是约束与门禁节点，具体 Markdown 文件是叶子节点。每条一级分支独立展开，避免连线和节点重叠。</text>

<rect x="50" y="850" width="310" height="70" rx="12" class="root"/><text x="205" y="892" text-anchor="middle" style="font:700 18px 'Microsoft YaHei';fill:#fff">doc-atlas/README.md</text>

<!-- root to six fixed README nodes -->
<path d="M360,885 H400 V150 H500 M400,885 V1600 H500" class="line"/>
