<path d="M800,1030 H850 V1390 M850,1030 V1530" class="line"/><g class="line"><line x1="850" y1="1390" x2="900" y2="1390"/><line x1="850" y1="1460" x2="900" y2="1460"/><line x1="850" y1="1530" x2="900" y2="1530"/></g>
